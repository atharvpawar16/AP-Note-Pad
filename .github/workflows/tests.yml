name: Tests

on:
  push:
  pull_request:

jobs:
  store-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      - run: npm ci
      - run: npm test
      - name: Uninstaller link-detection fixtures
        run: pwsh -NoProfile -File tests/uninstall-fixtures.ps1
