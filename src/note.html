<!doctype html>
<html><head><meta charset="utf-8"><title>AP Note Pad</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'">
<link rel="stylesheet" href="note.css"></head>
<body>
<div class="note" id="note">
  <div class="bar" id="bar">
    <button class="nav" id="prev" title="Previous day">&#8249;</button>
    <div class="date" id="date"></div>
    <button class="nav" id="next" title="Next day">&#8250;</button>
    <button class="nav sm" id="menu" title="Note options">&#8943;</button>
    <button class="nav sm" id="hide" title="Hide (tray icon brings it back)">&times;</button>
  </div>
  <div class="panel" id="panel" hidden>
    <div class="colors" id="colors"></div>
    <div class="oprow"><label for="opacity">Glass</label><input type="range" id="opacity" min="30" max="85" step="5" title="How much of your desktop shows through"></div>
    <button class="chip" id="lock"></button>
    <button class="chip danger" id="del">Delete note</button>
  </div>
  <textarea id="text" placeholder="Write a note..." spellcheck="false"></textarea>
  <div class="ask" id="ask" hidden>
    <div id="askmsg"></div>
    <div class="row"><button class="chip" id="askyes">Carry them</button><button class="chip" id="askno">Start blank</button></div>
    <div class="row small"><button class="chip" id="askyesall">Always carry</button><button class="chip" id="asknoall">Always blank</button></div>
  </div>
  <ul id="list"></ul>
  <input id="add" placeholder="Add a task" autocomplete="off" spellcheck="false">
  <div class="foot" id="foot"></div>
</div>
<script src="dates.js"></script>
<script src="note.js"></script>
</body></html>
